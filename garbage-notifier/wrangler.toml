name = "garbage-notifier"
main = "src/index.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["* * * * *"] # 每分鐘檢查（新北即時位置約 2 分鐘更新一次）

[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_ID"

[vars]
TELEGRAM_CHAT_ID = "REPLACE_WITH_CHAT_ID"
AHEAD = "1"           # 預設提前幾站提醒，可用 /ahead 改
GPS_MAX_AGE_MIN = "10" # GPS 超過幾分鐘沒更新就忽略
NEAR_M = "150" # 車子離清運點多近算「到站」（公尺）
# 新北市資料開放平台：垃圾清運車輛所在位置（已實測）
# 清運點資料已打包在 src/stops-data.js（scripts/update-stops.mjs 產生）
REALTIME_DATASET = "28ab4122-60e1-4065-98e5-abccb69aaca6"

# wrangler secret put TELEGRAM_BOT_TOKEN
# wrangler secret put WEBHOOK_SECRET
